<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline | KINS Official</title>
  <style>
    :root {
      --bg: #141416;
      --card: #18181c;
      --text: #f5f5f7;
      --text-muted: #8e8e93;
      --accent: #f2fd43;
      --border: 3px solid #000000;
      --shadow: 4px 4px 0px #000000;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0e0e12;
        --card: #141418;
        --accent: #d4af37;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .offline-card {
      background: var(--card);
      border: var(--border);
      box-shadow: var(--shadow);
      border-radius: 12px;
      padding: 32px 24px;
      max-width: 420px;
      width: 100%;
      text-align: center;
    }
    .badge {
      display: inline-block;
      background: var(--accent);
      color: #000000;
      font-weight: 900;
      font-size: 0.75rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 4px 10px;
      border: 2px solid #000000;
      box-shadow: 2px 2px 0px #000000;
      border-radius: 9999px;
      margin-bottom: 16px;
    }
    h1 { font-size: 1.5rem; font-weight: 900; margin-bottom: 8px; text-transform: uppercase; }
    p { color: var(--text-muted); font-size: 0.9rem; line-height: 1.5; margin-bottom: 24px; }
    .btn {
      display: inline-block;
      background: var(--accent);
      color: #000000;
      font-weight: 800;
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 12px 20px;
      border: 2px solid #000000;
      box-shadow: 3px 3px 0px #000000;
      border-radius: 6px;
      cursor: pointer;
      width: 100%;
      transition: transform 0.1s ease;
    }
    .btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0px #000000; }
  </style>
</head>
<body>
  <main class="offline-card">
    <div class="badge">OFFLINE MODE</div>
    <h1>You are currently offline</h1>
    <p>The cached pages and tools (Metronome & Tuner) remain functional without an internet connection.</p>
    <button class="btn" onclick="window.location.reload()">Retry Connection</button>
  </main>
</body>
</html>
