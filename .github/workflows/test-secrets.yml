name: Verify GitHub Secrets & Observability

on:
  workflow_dispatch: # Allows 1-click manual testing from GitHub Actions tab

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci

      - name: Test Supabase Connection & Discord Radar Webhook
        env:
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL || secrets.SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY }}
          DISCORD_TRAFFIC_WEBHOOK_URL: ${{ secrets.DISCORD_TRAFFIC_WEBHOOK_URL }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: |
          node -e "
          async function testSecrets() {
            console.log('🔍 Testing GitHub Repository Secrets...');
            
            // 1. Check Supabase URL & Key
            const sbUrl = process.env.PUBLIC_SUPABASE_URL;
            const sbKey = process.env.PUBLIC_SUPABASE_ANON_KEY;
            if (!sbUrl || !sbKey) {
              console.error('❌ Missing PUBLIC_SUPABASE_URL or PUBLIC_SUPABASE_ANON_KEY secret');
            } else {
              try {
                const res = await fetch(\`\${sbUrl}/rest/v1/analytics_events?select=id&limit=1\`, {
                  headers: { apikey: sbKey, Authorization: \`Bearer \${sbKey}\` }
                });
                if (res.ok) {
                  console.log('✅ Supabase Connection Verified: 200 OK');
                } else {
                  console.error('❌ Supabase Auth Failed:', res.status, await res.text());
                }
              } catch (e) {
                console.error('❌ Supabase Network Error:', e.message);
              }
            }

            // 2. Check Discord Traffic Webhook
            const discordUrl = process.env.DISCORD_TRAFFIC_WEBHOOK_URL;
            if (!discordUrl) {
              console.error('❌ Missing DISCORD_TRAFFIC_WEBHOOK_URL secret');
            } else {
              try {
                const res = await fetch(discordUrl, {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({
                    username: 'Kins Security Scanner',
                    embeds: [{
                      title: '🔐 GitHub Secrets Verification: Passed',
                      description: 'All repository secrets (Supabase & Discord) are properly configured and operational!',
                      color: 0x10b981,
                      timestamp: new Date().toISOString()
                    }]
                  })
                });
                if (res.ok || res.status === 204) {
                  console.log('✅ Discord Webhook Verified: Message sent to #traffic');
                } else {
                  console.error('❌ Discord Webhook Failed:', res.status, await res.text());
                }
              } catch (e) {
                console.error('❌ Discord Network Error:', e.message);
              }
            }
          }
          testSecrets().catch(console.error);
          "
