name: ⚡ Discord Live Traffic Radar

on:
  schedule:
    # Runs every hour
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  update-traffic:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Update Discord Traffic Radar
        env:
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL || secrets.SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY }}
          DISCORD_TRAFFIC_WEBHOOK_URL: ${{ secrets.DISCORD_TRAFFIC_WEBHOOK_URL }}
        run: node scripts/discordTrafficUpdater.js

      - name: Persist State (if changed)
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add .discord_traffic_state.json
          git diff --staged --quiet || git commit -m "🤖 chore: update discord traffic state [skip ci]"
          git push
